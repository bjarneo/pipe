name: Deploy with pipe

description: 'Deploy Docker containers to remote hosts via SSH - no registry required'

inputs:
  # Core settings
  host:
    description: 'Remote host to deploy to'
    required: true
  user:
    description: 'SSH user for remote host'
    required: false
    default: 'root'
  ssh_key:
    description: 'SSH private key content'
    required: true
    sensitive: true
  ssh_port:
    description: 'SSH port'
    required: false
    default: '22'

  # Image settings
  image:
    description: 'Docker image name'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile'
    required: false
    default: 'Dockerfile'
  tag:
    description: 'Docker image tag'
    required: false
    default: 'latest'
  platform:
    description: 'Docker platform'
    required: false
    default: 'linux/amd64'
  build_args:
    description: 'Build arguments (comma-separated KEY=VALUE pairs)'
    required: false

  # Container settings
  container_name:
    description: 'Name for the container'
    required: true
  container_port:
    description: 'Container port'
    required: true
  host_port:
    description: 'Host port'
    required: true
  env_file:
    description: 'Environment file path'
    required: false
  env_vars:
    description: 'Environment variables (comma-separated KEY=VALUE pairs)'
    required: false
  network:
    description: 'Docker network to connect to'
    required: false
  volumes:
    description: 'Volume mounts (comma-separated host:container pairs)'
    required: false
  restart_policy:
    description: 'Restart policy (no, always, on-failure, unless-stopped)'
    required: false
    default: 'unless-stopped'

  # Resource limits
  cpus:
    description: 'Number of CPUs (e.g., "0.5" or "2")'
    required: false
  memory:
    description: 'Memory limit (e.g., "512m" or "2g")'
    required: false

  # Health check
  health_cmd:
    description: 'Health check command'
    required: false
  health_interval:
    description: 'Health check interval (e.g., "30s")'
    required: false
  health_timeout:
    description: 'Health check timeout (e.g., "10s")'
    required: false
  health_retries:
    description: 'Health check retries'
    required: false

  # Advanced container options
  labels:
    description: 'Container labels (comma-separated KEY=VALUE pairs)'
    required: false
  entrypoint:
    description: 'Override container entrypoint'
    required: false
  command:
    description: 'Override container command'
    required: false
  container_user:
    description: 'User to run container as'
    required: false
  workdir:
    description: 'Working directory inside container'
    required: false
  hostname:
    description: 'Container hostname'
    required: false

  # Security
  privileged:
    description: 'Run container in privileged mode'
    required: false
    default: 'false'
  read_only:
    description: 'Mount root filesystem as read-only'
    required: false
    default: 'false'
  init:
    description: 'Run init inside container'
    required: false
    default: 'false'

  # Logging
  log_driver:
    description: 'Logging driver'
    required: false
  log_opts:
    description: 'Log driver options (comma-separated KEY=VALUE pairs)'
    required: false

  # Remote commands
  remote_commands:
    description: 'Commands to run after deployment (comma-separated)'
    required: false

  # Execution options
  rollback:
    description: 'Rollback to the previous version'
    required: false
    default: 'false'
  verbose:
    description: 'Show detailed output'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Download pipe
      shell: bash
      run: |
        curl -sL -o pipe "https://github.com/bjarneo/pipe/releases/latest/download/pipe-linux-amd64"
        chmod +x pipe

    - name: Prepare flags
      id: flags
      shell: bash
      run: |
        FLAGS=""
        
        # Build args
        if [ -n "${{ inputs.build_args }}" ]; then
          IFS=',' read -ra ARGS <<< "${{ inputs.build_args }}"
          for arg in "${ARGS[@]}"; do
            FLAGS="$FLAGS --build-arg $arg"
          done
        fi
        
        # Volumes
        if [ -n "${{ inputs.volumes }}" ]; then
          IFS=',' read -ra VOLS <<< "${{ inputs.volumes }}"
          for vol in "${VOLS[@]}"; do
            FLAGS="$FLAGS --volume $vol"
          done
        fi
        
        # Environment variables
        if [ -n "${{ inputs.env_vars }}" ]; then
          IFS=',' read -ra ENVS <<< "${{ inputs.env_vars }}"
          for env in "${ENVS[@]}"; do
            FLAGS="$FLAGS --env $env"
          done
        fi
        
        # Labels
        if [ -n "${{ inputs.labels }}" ]; then
          IFS=',' read -ra LBLS <<< "${{ inputs.labels }}"
          for lbl in "${LBLS[@]}"; do
            FLAGS="$FLAGS --label $lbl"
          done
        fi
        
        # Log opts
        if [ -n "${{ inputs.log_opts }}" ]; then
          IFS=',' read -ra OPTS <<< "${{ inputs.log_opts }}"
          for opt in "${OPTS[@]}"; do
            FLAGS="$FLAGS --log-opt $opt"
          done
        fi
        
        # Remote commands
        if [ -n "${{ inputs.remote_commands }}" ]; then
          IFS=',' read -ra CMDS <<< "${{ inputs.remote_commands }}"
          for cmd in "${CMDS[@]}"; do
            FLAGS="$FLAGS --remote-command \"$cmd\""
          done
        fi
        
        echo "flags=$FLAGS" >> $GITHUB_OUTPUT

    - name: Deploy with pipe
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        HOST_USER: ${{ inputs.user }}
        SSH_PORT: ${{ inputs.ssh_port }}
        HOST_PLATFORM: ${{ inputs.platform }}
        HOST_PORT: ${{ inputs.host_port }}
        DOCKER_IMAGE_NAME: ${{ inputs.image }}
        DOCKER_IMAGE_TAG: ${{ inputs.tag }}
        DOCKER_CONTAINER_NAME: ${{ inputs.container_name }}
        DOCKER_CONTAINER_PORT: ${{ inputs.container_port }}
        DOCKER_CONTAINER_ENV_FILE: ${{ inputs.env_file }}
        DOCKER_NETWORK: ${{ inputs.network }}
        DOCKER_CPUS: ${{ inputs.cpus }}
        DOCKER_MEMORY: ${{ inputs.memory }}
        RESTART_POLICY: ${{ inputs.restart_policy }}
        HEALTH_CMD: ${{ inputs.health_cmd }}
        HEALTH_INTERVAL: ${{ inputs.health_interval }}
        HEALTH_TIMEOUT: ${{ inputs.health_timeout }}
        HEALTH_RETRIES: ${{ inputs.health_retries }}
        CONTAINER_USER: ${{ inputs.container_user }}
        WORKDIR: ${{ inputs.workdir }}
        CONTAINER_HOSTNAME: ${{ inputs.hostname }}
        LOG_DRIVER: ${{ inputs.log_driver }}
        PRIVILEGED: ${{ inputs.privileged }}
        READ_ONLY: ${{ inputs.read_only }}
        INIT: ${{ inputs.init }}
        SSH_KEY_PATH: ~/.ssh/deploy_key
      run: |
        VERBOSE_FLAG=""
        if [ "${{ inputs.verbose }}" = "true" ]; then
          VERBOSE_FLAG="--verbose"
        fi
        
        if [ "${{ inputs.rollback }}" = "true" ]; then
          ./pipe --rollback $VERBOSE_FLAG
        else
          ./pipe \
            --dockerfile "${{ inputs.dockerfile }}" \
            ${{ steps.flags.outputs.flags }} \
            $VERBOSE_FLAG \
            $( [ -n "${{ inputs.entrypoint }}" ] && echo "--entrypoint ${{ inputs.entrypoint }}" ) \
            $( [ -n "${{ inputs.command }}" ] && echo "--command ${{ inputs.command }}" )
        fi

    - name: Upload deployment logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-logs
        path: deploy.log 
